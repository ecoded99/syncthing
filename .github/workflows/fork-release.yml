name: Signed fork release
on:
  push:
    tags: ['v*-ecoded.*']
env:
  BUILD_USER: ecoded
  BUILD_HOST: github.com
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: syncthing.exe
          - os: macos-15
            platform: macos-arm64
            binary: syncthing
          - os: ubuntu-latest
            platform: linux-amd64
            binary: syncthing
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-ecoded\.\d+$') { throw 'Invalid fork version' }
      - run: go run build.go assets
      - run: node script/test_gui_stats.cjs
      - env:
          CGO_ENABLED: ${{ matrix.platform == 'linux-amd64' && '0' || '1' }}
        run: go test ./cmd/dev/forkrelease ./cmd/syncthing ./internal/db/sqlite ./lib/cloudbackup ./lib/config ./lib/scanner ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/osutil ./lib/fs ./lib/explorerstatus
      - if: runner.os != 'Windows'
        run: go test -race ./internal/db/sqlite -run 'TestMtime' -count=1
      - if: runner.os != 'Windows'
        run: go test -race ./lib/fs -run 'TestWalkParallel|TestWalk' -count=1
      - if: runner.os != 'Windows'
        run: go test -race ./lib/scanner
      - if: runner.os != 'Windows'
        run: go test -race ./lib/protocol ./lib/model -run 'Test.*Bundle|TestBatch|Test.*Progress|Test.*Completion|Test.*DeviceDownloadState|TestBlocksToSize|TestRequestTemporaryAfterPromotion|TestScanDeletion' -count=1
      - name: Build ${{ matrix.platform }}
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'linux-amd64') { $env:CGO_ENABLED = '0' }
          go run build.go -version $env:GITHUB_REF_NAME build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "./${{ matrix.binary }}" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Verify interrupted-transfer recovery before signing
        run: python script/smoke_bundle_recovery.py --binary syncthing.exe --work "${{ runner.temp }}/bundle-recovery" --files 2048
      - if: runner.os == 'Windows'
        name: Verify sync status and estimates before signing
        shell: pwsh
        run: |
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-quic" --transport quic --bundles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-tcp" --transport tcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node script/test_gui_stats.cjs "${{ runner.temp }}/sync-status-quic/results.json" "${{ runner.temp }}/sync-status-tcp/results.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Verify reliable full scans on the native executable
        shell: pwsh
        run: |
          python script/benchmark_scans.py --binary syncthing.exe --baseline-binary syncthing.exe --work "${{ runner.temp }}/scan-reliability" --files 512 --trials 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign archive
        shell: pwsh
        env:
          STFORK_SIGNING_KEY: ${{ secrets.STFORK_SIGNING_KEY }}
        run: |
          $archive="syncthing-${{ matrix.platform }}-$env:GITHUB_REF_NAME.zip"
          go run ./cmd/dev/forkrelease -binary '${{ matrix.binary }}' -archive $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'macOS'
        name: Package and verify macOS application disk image
        shell: bash
        run: bash script/package_macos_dmg.sh syncthing "$GITHUB_REF_NAME" "$PWD/syncthing-macos-arm64-$GITHUB_REF_NAME.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.platform }}
          path: |
            syncthing-${{ matrix.platform }}-*.zip
            syncthing-${{ matrix.platform }}-*.dmg
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip *.dmg > SHA256SUMS.txt
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME" --notes 'Signed updater packages for Linux amd64, Windows amd64 and macOS Apple Silicon. Live remote progress can update during slow index application, with configuration and progress ordering preserved. Includes native protocol regression tests. Faster scanning uses batched metadata, four bounded comparison workers and hashing during discovery. Scan status shows phases, scope, trigger and entry counts. Throughput refreshes every second, with separate file writes, finalized bytes and files/s. QUIC preference, TCP fallback, hash verification, conflicts and durable finalization remain enforced. Existing bundle opt-in settings are preserved. macOS binaries are updater-signed but not Apple Developer ID signed or notarized. See SCAN_PIPELINE.md, TRANSFER_STATS.md and RELEASE-READINESS.md.'
  update-feed:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/fork-update-feed.yml
