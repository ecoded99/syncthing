name: Signed fork release
on:
  push:
    tags: ['v*-ecoded.*']
env:
  BUILD_USER: ecoded
  BUILD_HOST: github.com
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-ecoded\.\d+$') { throw 'Invalid fork version' }
      - run: go run build.go assets
      - run: go test ./lib/cloudbackup ./lib/config ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/fs ./lib/osutil
      - run: go test -race ./lib/fs ./lib/model -run 'TestPrepareFileMetadata|TestRecordMtime|TestRenameNew|TestSharedPullerFast'
      - name: Build Windows amd64
        shell: pwsh
        run: |
          go run build.go -version $env:GITHUB_REF_NAME build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign archive
        shell: pwsh
        env:
          STFORK_SIGNING_KEY: ${{ secrets.STFORK_SIGNING_KEY }}
        run: |
          $archive="syncthing-windows-amd64-$env:GITHUB_REF_NAME.zip"
          go run ./cmd/dev/forkrelease -binary syncthing.exe -archive $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + '  ' + $archive | Set-Content SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            syncthing-windows-amd64-*.zip
            SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME" --notes 'Experimental ecoded fork: native secondary backup and optional batched small-file transport. Batching is disabled by default. Enable prerelease updates only on canary devices. See FORK.md for limits and rollout instructions.'
