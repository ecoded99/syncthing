name: Signed fork release
on:
  push:
    tags: ['v*-ecoded.*']
env:
  BUILD_USER: ecoded
  BUILD_HOST: github.com
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: syncthing.exe
          - os: macos-14
            platform: macos-arm64
            binary: syncthing
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-ecoded\.\d+$') { throw 'Invalid fork version' }
      - run: go run build.go assets
      - run: go test ./cmd/dev/forkrelease ./cmd/syncthing ./internal/db/sqlite ./lib/cloudbackup ./lib/config ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/osutil ./lib/fs ./lib/explorerstatus
      - if: runner.os != 'Windows'
        run: go test -race ./lib/protocol ./lib/model -run 'Test.*Bundle|TestBatch' -count=1
      - name: Build ${{ matrix.platform }}
        shell: pwsh
        run: |
          go run build.go -version $env:GITHUB_REF_NAME build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "./${{ matrix.binary }}" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Verify interrupted-transfer recovery before signing
        run: python script/smoke_bundle_recovery.py --binary syncthing.exe --work "${{ runner.temp }}/bundle-recovery" --files 2048
      - name: Sign archive
        shell: pwsh
        env:
          STFORK_SIGNING_KEY: ${{ secrets.STFORK_SIGNING_KEY }}
        run: |
          $archive="syncthing-${{ matrix.platform }}-$env:GITHUB_REF_NAME.zip"
          go run ./cmd/dev/forkrelease -binary '${{ matrix.binary }}' -archive $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.platform }}
          path: syncthing-${{ matrix.platform }}-*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME" --notes 'Signed updater packages for Windows amd64 and macOS Apple Silicon: bounded parallel bundle reads and checksum verification, adaptive receiver admission from 16 to 32 files, QUIC preference with TCP fallback, and transfer pipeline throughput statistics. Normal authorization, request-memory limits, hash verification, conflicts and durable finalization remain enforced. Existing bundle opt-in settings are preserved. macOS binaries are not Apple Developer ID signed or notarized. See PARALLEL_BUNDLES.md, TRANSFER_STATS.md and RELEASE-READINESS.md.'
  update-feed:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/fork-update-feed.yml
