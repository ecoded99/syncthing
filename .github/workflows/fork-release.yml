name: Signed fork release
on:
  push:
    tags: ['v*-ecoded.*']
env:
  BUILD_USER: ecoded
  BUILD_HOST: github.com
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-amd64
            binary: syncthing.exe
          - os: macos-15
            platform: macos-arm64
            binary: syncthing
          - os: ubuntu-latest
            platform: linux-amd64
            binary: syncthing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: ${{ matrix.platform == 'linux-amd64' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-ecoded\.\d+$') { throw 'Invalid fork version' }
      - run: go run build.go assets
      - if: runner.os == 'Linux'
        run: node script/test_gui_stats.cjs
      - if: runner.os == 'Linux'
        run: node script/test_gui_folder_path.cjs
      - run: go test -trimpath ./cmd/dev/forkrelease ./cmd/syncthing ./internal/db/sqlite ./lib/cloudbackup ./lib/config ./lib/scanner ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/osutil ./lib/fs ./lib/explorerstatus
      - if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/db/sqlite -run 'TestMtime' -count=1
      - if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./lib/fs -run 'TestWalkParallel|TestWalk' -count=1
      - if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./lib/scanner
      - if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./lib/protocol ./lib/model -run 'Test.*Bundle|TestBatch|Test.*Progress|Test.*Completion|Test.*DeviceDownloadState|TestBlocksToSize|TestRequestTemporaryAfterPromotion|TestScanDeletion' -count=1
      - name: Build ${{ matrix.platform }}
        shell: pwsh
        run: |
          go run build.go -version $env:GITHUB_REF_NAME build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "./${{ matrix.binary }}" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Verify folder relocation and missing-path protection before signing
        run: python script/smoke_folder_path.py --binary syncthing.exe --work "${{ runner.temp }}/folder-path"
      - if: runner.os == 'Windows'
        name: Verify interrupted-transfer recovery before signing
        run: python script/smoke_bundle_recovery.py --binary syncthing.exe --work "${{ runner.temp }}/bundle-recovery" --files 2048
      - if: runner.os == 'Windows'
        name: Verify sync status and estimates before signing
        shell: pwsh
        run: |
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-quic" --transport quic --bundles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-tcp" --transport tcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node script/test_gui_stats.cjs "${{ runner.temp }}/sync-status-quic/results.json" "${{ runner.temp }}/sync-status-tcp/results.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Verify reliable full scans on the native executable
        shell: pwsh
        run: |
          python script/benchmark_scans.py --binary syncthing.exe --baseline-binary syncthing.exe --work "${{ runner.temp }}/scan-reliability" --files 512 --trials 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Package and verify Windows installer
        shell: pwsh
        run: |
          ./script/package_windows_installer.ps1 -Binary ./syncthing.exe -Version $env:GITHUB_REF_NAME
          ./script/windows/verify-installer.ps1 -Binary ./syncthing.exe -Installer "./syncthing-windows-amd64-$env:GITHUB_REF_NAME-setup.exe"
      - name: Sign archive
        shell: pwsh
        env:
          STFORK_SIGNING_KEY: ${{ secrets.STFORK_SIGNING_KEY }}
        run: |
          $archive="syncthing-${{ matrix.platform }}-$env:GITHUB_REF_NAME.zip"
          go run ./cmd/dev/forkrelease -binary '${{ matrix.binary }}' -archive $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'macOS'
        name: Package and verify macOS application disk image
        shell: bash
        run: bash script/package_macos_dmg.sh syncthing "$GITHUB_REF_NAME" "$PWD/syncthing-macos-arm64-$GITHUB_REF_NAME.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.platform }}
          path: |
            syncthing-${{ matrix.platform }}-*.zip
            syncthing-${{ matrix.platform }}-*.dmg
            syncthing-${{ matrix.platform }}-*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip *.dmg *-setup.exe > SHA256SUMS.txt
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME" --notes 'Existing folder paths can now be changed under Edit > General > Change Path. Saving pauses the folder; move all files including hidden .stfolder, .stignore and .stversions entries before resuming. Folder IDs, sharing settings and indexes are preserved. Verified with two disposable peers, missing-destination protection, bidirectional sync and restart recovery. Windows now includes a per-user setup EXE with optional automatic startup at sign-in. Installed copies continue to update through the signed in-app updater without manual ZIP downloads. The setup EXE is not Authenticode-signed. Signed updater archives are included for Windows amd64, Linux amd64 and macOS Apple Silicon. macOS builds are not Apple Developer ID signed or notarized. See FORK.md and script/windows/README.txt.'
  update-feed:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/fork-update-feed.yml
