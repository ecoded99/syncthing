name: Signed fork release
on:
  push:
    tags: ['v*-ecoded.*']
env:
  BUILD_USER: ecoded
  BUILD_HOST: github.com
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: syncthing.exe
          - os: macos-15
            platform: macos-arm64
            binary: syncthing
          - os: macos-15-intel
            platform: macos-amd64
            binary: syncthing
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-ecoded\.\d+$') { throw 'Invalid fork version' }
      - run: go run build.go assets
      - run: go test ./cmd/dev/forkrelease ./cmd/syncthing ./internal/db/sqlite ./lib/cloudbackup ./lib/config ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/osutil ./lib/fs ./lib/explorerstatus
      - name: Build ${{ matrix.platform }}
        shell: pwsh
        run: |
          go run build.go -version $env:GITHUB_REF_NAME build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "./${{ matrix.binary }}" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign archive
        shell: pwsh
        env:
          STFORK_SIGNING_KEY: ${{ secrets.STFORK_SIGNING_KEY }}
        run: |
          $archive="syncthing-${{ matrix.platform }}-$env:GITHUB_REF_NAME.zip"
          go run ./cmd/dev/forkrelease -binary '${{ matrix.binary }}' -archive $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.platform }}
          path: syncthing-${{ matrix.platform }}-*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME" --notes 'Adds Test Link Speed beside Pause/Edit on connected remote devices, showing download and upload throughput in Mbps. Update both devices to this release to run tests. Tests use existing authenticated connections, send at most 64 MiB per direction, and time out after 20 seconds. Includes signed updater archives for Windows amd64, macOS Apple Silicon (arm64), and macOS Intel (amd64). Existing Drive backup, Explorer integration, and optional small-file batching are retained. macOS binaries are not Apple Developer ID signed or notarized; tray and Explorer integration are Windows-only. Enable prerelease updates to receive this release through Check for Updates. See FORK.md for details.'
  update-feed:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/fork-update-feed.yml
