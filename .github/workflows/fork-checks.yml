name: Fork checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go run build.go assets
      - if: runner.os == 'Linux'
        run: node script/test_gui_stats.cjs
      - name: Run native tests
        env:
          CGO_ENABLED: ${{ runner.os == 'Linux' && '0' || '1' }}
        run: go test -trimpath ./cmd/dev/forkrelease ./cmd/syncthing ./internal/db/sqlite ./lib/cloudbackup ./lib/config ./lib/scanner ./lib/protocol ./lib/upgrade ./lib/api ./lib/syncthing ./lib/model ./lib/osutil ./lib/fs ./lib/explorerstatus
      - if: runner.os != 'macOS'
        name: Build and verify the native executable
        shell: pwsh
        env:
          CGO_ENABLED: ${{ runner.os == 'Linux' && '0' || '1' }}
        run: |
          go run build.go -version v2.1.7-ecoded.1 build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = if ($IsWindows) { './syncthing.exe' } else { './syncthing' }
          & $binary --version
      - if: runner.os == 'Windows'
        name: Verify Windows installer
        shell: pwsh
        run: |
          ./script/package_windows_installer.ps1 -Binary ./syncthing.exe -Version v2.1.7-ecoded.1
          ./script/windows/verify-installer.ps1 -Binary ./syncthing.exe -Installer ./syncthing-windows-amd64-v2.1.7-ecoded.1-setup.exe
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Bundle interrupted-transfer recovery
        run: python script/smoke_bundle_recovery.py --binary syncthing.exe --work "${{ runner.temp }}/bundle-recovery" --files 2048
      - if: runner.os == 'Windows'
        name: Verify sync status and estimate recordings
        shell: pwsh
        run: |
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-quic" --transport quic --bundles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python script/smoke_sync_status.py --binary syncthing.exe --work "${{ runner.temp }}/sync-status-tcp" --transport tcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node script/test_gui_stats.cjs "${{ runner.temp }}/sync-status-quic/results.json" "${{ runner.temp }}/sync-status-tcp/results.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Verify reliable full scans on the native executable
        shell: pwsh
        run: |
          python script/benchmark_scans.py --binary syncthing.exe --baseline-binary syncthing.exe --work "${{ runner.temp }}/scan-reliability" --files 512 --trials 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-recovery-windows
          retention-days: 7
          path: |
            ${{ runner.temp }}/scan-reliability/results.json
            ${{ runner.temp }}/scan-reliability/**/console.log
            ${{ runner.temp }}/bundle-recovery/results.json
            ${{ runner.temp }}/bundle-recovery/**/console.log
            ${{ runner.temp }}/sync-status-*/results.json
            ${{ runner.temp }}/sync-status-*/samples.json
            ${{ runner.temp }}/sync-status-*/**/console.log
          if-no-files-found: ignore
      - if: runner.os == 'Linux'
        run: go test -race ./internal/db/sqlite -run 'TestMtime' -count=1
      - if: runner.os == 'Linux'
        run: go test -race ./lib/fs -run 'TestWalkParallel|TestWalk' -count=1
      - if: runner.os == 'Linux'
        run: go test -race ./lib/cloudbackup ./lib/scanner ./lib/protocol
      - if: runner.os == 'Linux'
        run: go test -race ./lib/model -run 'Test.*Bundle|Test.*Progress|Test.*Completion|Test.*DeviceDownloadState|TestBlocksToSize|TestRequestTemporaryAfterPromotion|TestScanDeletion' -count=1
      - if: runner.os == 'Linux'
        run: go test ./lib/protocol -run '^$' -fuzz '^FuzzBatchRequestDecoder$' -fuzztime 10s
      - if: runner.os == 'Linux'
        run: go test ./lib/protocol -run '^$' -fuzz '^FuzzBatchResponseDecoder$' -fuzztime 10s
